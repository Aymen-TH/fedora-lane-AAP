---
- name: Provision and Configure Fedora Lane RHEL 10 EC2 Instances
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  roles:
    - role: aws_provision

- name: Configure Fedora Lane RHEL Instances
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: configure_rhel