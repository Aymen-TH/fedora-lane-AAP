
---
# 1. Discover the Fedora Lane VPC.
- name: Find existing Fedora Lane VPC
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      "tag:Project": "{{ project_name }}"
      "tag:Name": "{{ vpc_name }}"
  register: fedora_lane_vpc_lookup

# 2. Safety checks for existing infrastructure.
- name: Ensure there is at most one matching VPC
  ansible.builtin.assert:
    that:
      - fedora_lane_vpc_lookup.vpcs | length <= 1
    fail_msg: >-
      Multiple VPCs match Fedora Lane.
      Refusing to continue.

- name: Ensure an existing VPC was completed by this automation
  ansible.builtin.assert:
    that:
      - >-
        (fedora_lane_vpc_lookup.vpcs[0].tags |
        default({})).get('FedoraLaneNetworkStatus', '') == 'complete'
    fail_msg: >-
      A Fedora Lane VPC already exists but does not have the
      completion marker. It may be an incomplete deployment.
      Refusing to modify it automatically.
  when: fedora_lane_vpc_lookup.vpcs | length == 1

- name: Report existing completed network
  ansible.builtin.debug:
    msg: >-
      Fedora Lane network already exists and is marked complete.
      No AWS resources will be modified.
  when: fedora_lane_vpc_lookup.vpcs | length == 1

# 3. Create the VPC only when it does not exist.
- name: Create Fedora Lane VPC
  amazon.aws.ec2_vpc_net:
    name: "{{ vpc_name }}"
    cidr_block: "{{ vpc_cidr }}"
    region: "{{ aws_region }}"
    dns_support: true
    dns_hostnames: true
    tags: "{{ aws_resource_tags | combine({'Name': vpc_name}) }}"
    state: present
  register: fedora_lane_vpc_created
  when: fedora_lane_vpc_lookup.vpcs | length == 0

# 4. Create the public subnet.
- name: Create Fedora Lane public subnet
  amazon.aws.ec2_vpc_subnet:
    vpc_id: "{{ fedora_lane_vpc_created.vpc.id }}"
    cidr: "{{ subnet_cidr }}"
    region: "{{ aws_region }}"
    map_public: "{{ aws_subnet_map_public_ip }}"
    tags: "{{ aws_resource_tags | combine({'Name': subnet_name}) }}"
    state: present
  register: fedora_lane_subnet_created
  when: fedora_lane_vpc_lookup.vpcs | length == 0

# 5. Create and attach the Internet Gateway.
- name: Create Fedora Lane Internet Gateway
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{ fedora_lane_vpc_created.vpc.id }}"
    region: "{{ aws_region }}"
    tags: "{{ aws_resource_tags | combine({'Name': vpc_name ~ '-igw'}) }}"
    state: present
  register: fedora_lane_igw_created
  when: fedora_lane_vpc_lookup.vpcs | length == 0

# 6. Create the public route table.
- name: Create Fedora Lane public route table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ fedora_lane_vpc_created.vpc.id }}"
    region: "{{ aws_region }}"
    subnets:
      - "{{ fedora_lane_subnet_created.subnet.id }}"
    routes:
      - dest: 0.0.0.0/0
        gateway_id: "{{ fedora_lane_igw_created.gateway_id }}"
    tags: "{{ aws_resource_tags | combine({'Name': vpc_name ~ '-public-rt'}) }}"
    state: present
  register: fedora_lane_route_table_created
  when: fedora_lane_vpc_lookup.vpcs | length == 0

# 7. Create the security group.
- name: Create Fedora Lane security group
  amazon.aws.ec2_security_group:
    name: "{{ security_group_name }}"
    description: Fedora Lane RHEL instances security group
    vpc_id: "{{ fedora_lane_vpc_created.vpc.id }}"
    region: "{{ aws_region }}"
    tags: "{{ aws_resource_tags | combine({'Name': security_group_name}) }}"
    rules:
      - proto: tcp
        ports:
          - "{{ aws_bootstrap_ssh_port | int }}"
          - "{{ ssh_port | int }}"
        cidr_ip: "{{ allowed_ssh_cidr }}"
        rule_desc: SSH bootstrap and final access
      - proto: tcp
        ports:
          - "{{ http_port | int }}"
        cidr_ip: "{{ allowed_http_cidr }}"
        rule_desc: Fedora Lane HTTP service
    rules_egress:
      - proto: all
        cidr_ip: 0.0.0.0/0
    state: present
  register: fedora_lane_sg_created
  when: fedora_lane_vpc_lookup.vpcs | length == 0

# 8. Mark the network complete only after all resources succeeded.
- name: Mark Fedora Lane VPC network as complete
  amazon.aws.ec2_tag:
    region: "{{ aws_region }}"
    resource: "{{ fedora_lane_vpc_created.vpc.id }}"
    state: present
    tags:
      FedoraLaneNetworkStatus: complete
  when: fedora_lane_vpc_lookup.vpcs | length == 0
