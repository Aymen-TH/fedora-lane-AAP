---
# RHEL 10 x86_64 AMI in eu-north-1
aws_ami_id: ami-036395f5b6e41d8bf

# AWS configuration
aws_region: eu-north-1
deployment_environment: dev

# Network configuration
vpc_name: fedora-lane-vpc
vpc_cidr: 10.20.0.0/16



# Security group
security_group_name: fedora-lane-SG
# Desired VM count
aws_instance_count: 2

# EC2 configuration
aws_instance_type: t3.micro
aws_instance_name_prefix: fedora-lane-rhel

# AWS EC2 Key Pair
aws_key_pair_name: fedora-lane-automation

# Root EBS volume
aws_root_volume_size: 25
aws_root_volume_type: gp3


# Public IP
aws_assign_public_ip: true

# Instance state
aws_instance_state: running
