
---
# 1. Locate the Fedora Lane VPC.
- name: Find Fedora Lane VPC
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      "tag:Project": "{{ project_name }}"
      "tag:Name": "{{ vpc_name }}"
  register: cleanup_vpc_lookup

- name: Ensure at most one Fedora Lane VPC exists
  ansible.builtin.assert:
    that:
      - cleanup_vpc_lookup.vpcs | length <= 1
    fail_msg: Multiple Fedora Lane VPCs found. Refusing cleanup.

- name: Verify ownership of the VPC
  ansible.builtin.assert:
    that:
      - cleanup_vpc_lookup.vpcs[0].tags.ManagedBy == managed_by
      - cleanup_vpc_lookup.vpcs[0].tags.Environment == deployment_environment
      - cleanup_vpc_lookup.vpcs[0].tags.FedoraLaneNetworkStatus == 'complete'
    fail_msg: VPC ownership or completion marker does not match.
  when: cleanup_vpc_lookup.vpcs | length == 1

- name: Report that no Fedora Lane VPC exists
  ansible.builtin.debug:
    msg: No Fedora Lane VPC found. Nothing to clean up.
  when: cleanup_vpc_lookup.vpcs | length == 0

# All remaining tasks are restricted to the verified VPC.
- name: Clean up Fedora Lane resources
  when: cleanup_vpc_lookup.vpcs | length == 1
  block:

    # 2. Terminate all owned EC2 instances.
    - name: Terminate Fedora Lane EC2 instances
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        state: absent
        wait: true
        wait_timeout: 600
        filters:
          vpc-id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
          "tag:Project": "{{ project_name }}"
          "tag:ManagedBy": "{{ managed_by }}"
          "tag:Environment": "{{ deployment_environment }}"
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped

    # 3. Find and remove the dedicated Fedora Lane route table.
    - name: Find Fedora Lane route table
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
          "tag:Name": "{{ vpc_name }}-public-rt"
      register: cleanup_route_table_lookup

    - name: Remove Fedora Lane custom route table
      amazon.aws.ec2_vpc_route_table:
        region: "{{ aws_region }}"
        vpc_id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
        route_table_id: "{{ item.route_table_id }}"
        lookup: id
        state: absent
      loop: "{{ cleanup_route_table_lookup.route_tables }}"
      when:
        - (item.tags | default({})).get('Project', '') == project_name
        - (item.tags | default({})).get('ManagedBy', '') == managed_by
        - (item.tags | default({})).get('Environment', '') == deployment_environment

    # 4. Detach and delete the Fedora Lane Internet Gateway.
    - name: Delete Fedora Lane Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ aws_region }}"
        vpc_id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
        state: absent

    # 5. Find and remove the Fedora Lane security group.
    - name: Find Fedora Lane security group
      amazon.aws.ec2_security_group_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
          group-name: "{{ security_group_name }}"
      register: cleanup_sg_lookup

    - name: Delete Fedora Lane security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        group_id: "{{ item.group_id }}"
        state: absent
      loop: "{{ cleanup_sg_lookup.security_groups }}"
      when:
        - item.tags.Project | default('') == project_name
        - item.tags.ManagedBy | default('') == managed_by
        - item.tags.Environment | default('') == deployment_environment

    # 6. Find and remove the Fedora Lane subnet.
    - name: Find Fedora Lane subnet
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
          "tag:Name": "{{ subnet_name }}"
      register: cleanup_subnet_lookup

    - name: Delete Fedora Lane subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ aws_region }}"
        vpc_id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
        cidr: "{{ item.cidr_block }}"
        state: absent
      loop: "{{ cleanup_subnet_lookup.subnets }}"
      when:
        - item.tags.Project | default('') == project_name
        - item.tags.ManagedBy | default('') == managed_by
        - item.tags.Environment | default('') == deployment_environment

    # 7. Delete the Fedora Lane VPC last.
    - name: Delete Fedora Lane VPC
      amazon.aws.ec2_vpc_net:
        region: "{{ aws_region }}"
        vpc_id: "{{ cleanup_vpc_lookup.vpcs[0].vpc_id }}"
        state: absent
